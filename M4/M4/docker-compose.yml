services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kineticguard
      POSTGRES_USER: kineticguard
      POSTGRES_PASSWORD: kineticguard_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kineticguard -d kineticguard"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kineticguard:kineticguard_dev_password@database:5432/kineticguard
      SECRET_KEY: replace-this-development-secret-before-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/app/storage/videos
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
