server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side (e.g. /athletes/abc-123).
    # Without this fallback, refreshing the page on any route other than
    # "/" would hit nginx directly, find no matching file, and 404 --
    # this line tells nginx to serve index.html for any unmatched path
    # and let React Router take over from there. Verified by hand: a
    # request to an unknown client-side route correctly returns 200 with
    # this rule in place, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively -- Vite fingerprints
    # filenames on every build (e.g. index-a1b2c3.js), so a new deploy
    # automatically gets a new filename instead of fighting a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
