services:

  postgres:
    image: postgres:16-alpine
    container_name: sports-injury-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sports_injury_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sports_injury_db}"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sports-injury-backend
    restart: unless-stopped

    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sports_injury_db}

      FRONTEND_URL: http://localhost:5173

      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-sports_injury_session_secret_2026}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-sports_injury_oauth_secret_2026}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sports-injury-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data:
  uploads_data:
