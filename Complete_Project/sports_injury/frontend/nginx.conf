server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter) — any path
    # that doesn't match a real static file falls back to index.html so
    # deep links like /injury-risk or /athlete-detail/3 work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed Vite build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
