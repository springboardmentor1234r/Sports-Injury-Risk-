# Render Blueprint -- deploys this entire app with one click via
# "New > Blueprint" in the Render dashboard, pointed at this repo.
#
# Docker Compose itself can't be deployed directly to Render (confirmed: Render
# has no Compose support) -- this file is the Render-native equivalent,
# translating each compose service into its Render counterpart. The frontend
# is a "static" service here rather than a Docker+nginx container: Render has
# a purpose-built static site host that's simpler and cheaper than running a
# whole nginx container just to serve compiled files, so we use it instead of
# reusing frontend/Dockerfile for this specific deployment target.
#
# Full reference: https://render.com/docs/blueprint-spec

databases:
  - name: sports-injury-db
    databaseName: sports_injury_db
    user: sports_user
    plan: free  # NOTE: free Render Postgres instances expire after 30 days.
                # Fine for a demo/trial deployment; switch to a paid plan
                # before this holds any data you can't afford to lose.

services:
  - type: web
    name: sports-injury-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # NOTE ON PLAN CHOICE: the free web service tier gives 512MB RAM, which
    # is genuinely tight for MediaPipe + OpenCV video processing -- this is
    # flagged here rather than promised to work, since it hasn't been load
    # tested against Render's actual free-tier memory limit. `starter` is
    # the safer starting point; downgrade to `free` and see if it holds up
    # for your actual video sizes if cost is the priority.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sports-injury-db
          property: connectionString
      - key: SECRET_KEY
        sync: false  # left blank here deliberately -- set the real value in
                     # the Render dashboard after first deploy, never commit
                     # a real secret into render.yaml or git.
      - key: CORS_ORIGINS
        value: https://sports-injury-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      # Persistent disk for uploaded videos -- without this, every deploy
      # or restart would wipe app/storage/videos, since a container's own
      # filesystem is ephemeral by default (same reasoning as the
      # docker-compose.yml video_storage volume, Render's equivalent).
      name: video-storage
      mountPath: /app/storage/videos
      sizeGB: 1

  - type: static
    name: sports-injury-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://sports-injury-backend.onrender.com
        # Update this after your first deploy if Render assigns a different
        # service URL than expected -- then trigger a redeploy, since Vite
        # bakes this value in at BUILD time (see frontend/Dockerfile's
        # comment on the same constraint).
    routes:
      # Same SPA fallback reasoning as frontend/nginx.conf: React Router
      # handles routing client-side, so any path Render doesn't recognize
      # as a real file should still serve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
